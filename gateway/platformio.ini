; Heliograph gateway firmware for Heltec WiFi LoRa 32 V3 (ESP32-S3).
; Proof of concept: exposes a watch-friendly BLE service whose every frame
; fits in the tactix's 20-byte read limit. Serves canned nodes + messages
; for now; later this bridges to real Meshtastic/LoRa (or moves onto a Pi).
[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
