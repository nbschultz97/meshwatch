; Heliograph gateway firmware for Heltec WiFi LoRa 32 V3 (ESP32-S3).
;
; One Heltec does both jobs:
;   - Watch bridge: BLE service a3c8f000-... carrying <=20B frames so the
;     tactix's 22-byte BLE-MTU wall never trips.
;   - Mesh node: SX1262 LoRa (US915 sub-band 2, SF11/BW125) carrying the
;     same frame format so multiple Heltecs form a small mesh.
;
; Frames flow both ways: LoRa RX -> BLE queue, BLE SEND -> LoRa TX.
; See include/lora_link.h for the wire format and src/main.cpp for the
; protocol glue.
[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    jgromes/RadioLib@^7.1.0
