; meshwatch bridge — puts real Meshtastic traffic in front of a Garmin watch.
;
; Connect IQ caps every BLE characteristic read at ~20 bytes and gives no MTU
; negotiation, so a watch cannot read Meshtastic's packets directly: a
; MeshPacket spends ~17 bytes on framing before its payload, and the next
; fromRadio read dequeues the next packet, so the tail is unrecoverable.
;
; This firmware sits in the middle. It talks to a stock Meshtastic node as a
; BLE *central* with a 517-byte MTU (so it sees whole packets), and serves the
; watch as a BLE *peripheral* where every frame is <= 20 bytes.
;
; Any ESP32 with BLE works. No LoRa radio needed — the bridge never touches
; the air, it just re-frames.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
build_unflags =
    -std=gnu++11

; Plain ESP32 devkit — the cheapest thing that works.
[env:esp32dev]
board = esp32dev

; Heltec WiFi LoRa 32 V3 (ESP32-S3). The LoRa radio sits unused; this is here
; because it is a common spare once a node has been repurposed.
[env:heltec_v3]
board = heltec_wifi_lora_32_V3
