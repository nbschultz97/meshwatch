; BREAZE node — solar-powered sentry that joins the PICKET mesh.
;
; Air params match PICKET exactly so BREAZE nodes are heard by any SX1262
; receiver on the same channel. Frames use a 0xBEEF magic so PICKET's HMAC
; framer ignores them; BREAZE doesn't try to verify PICKET cues either.
;
; Hardware: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262) + PIR + LDR + 18650,
; inside a Harbor Freight solar walkway light housing. Sleeps 99% of the time;
; wakes on PIR, RTC, or RX window.
;
; See include/config.h for pin map and intervals.
[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.0
